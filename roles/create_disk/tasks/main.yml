---
# roles/create_disk/tasks/main.yml
#
# Prepara il disco dati dedicato a {{ rancher_mount_point }}.
#
# MODALITA' DI VERIFICA (nessuna modifica al server):
#   ansible-playbook -i inventory.ini check_disk.yml
#   ansible-playbook -i inventory.ini site.yml -e create_disk_check_only=true
#   ansible-playbook -i inventory.ini site.yml --check
#
# FORZARE UN DISCO SPECIFICO:
#   ansible-playbook -i inventory.ini check_disk.yml -e rancher_disk_device=/dev/sdb

- name: "Rileva il disco dati (sola lettura)"
  ansible.builtin.include_tasks: detect.yml

- name: "Crea il punto di mount {{ rancher_mount_point }}"
  ansible.builtin.file:
    path: "{{ rancher_mount_point }}"
    state: directory
    mode: "0755"
  when: not (create_disk_check_only | bool)

- name: "Predisponi disco, LVM, filesystem e mount"
  ansible.builtin.include_tasks: provision.yml
  when:
    - not (create_disk_check_only | bool)
    - not ansible_check_mode
    - not create_disk_existing_lv.stat.exists
    - selected_disk is defined

- name: "Nessuna modifica applicata"
  ansible.builtin.debug:
    msg: >-
      {{ 'MODALITA VERIFICA: nessuna modifica applicata a ' ~ inventory_hostname
         if (create_disk_check_only | bool) or ansible_check_mode
         else ('LVM GIA PRESENTE su ' ~ inventory_hostname ~ ': nessuna modifica necessaria.'
               if create_disk_existing_lv.stat.exists
               else 'NESSUN DISCO LIBERO su ' ~ inventory_hostname ~ ': setup LVM saltato.') }}
  when: >-
    (create_disk_check_only | bool) or ansible_check_mode
    or create_disk_existing_lv.stat.exists or selected_disk is not defined
