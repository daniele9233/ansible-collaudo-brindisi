---
- name: Create /etc/rancher/rke2/config.yaml on master1
  ansible.builtin.template:
    src: config_master1.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  register: rke2_config

# Il file di configurazione viene letto solo all'avvio del servizio. Senza
# questo riavvio il tls-san con il dominio Rancher non entra mai nel
# certificato dell'API server: kubectl e gli agent che passano dal FQDN
# fallirebbero la verifica TLS.
- name: Riavvia rke2-server se la configurazione e' cambiata
  ansible.builtin.systemd:
    name: rke2-server
    state: restarted
  when: rke2_config.changed
