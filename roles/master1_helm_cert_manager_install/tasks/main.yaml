---
# ---------------------------------------------------------------------------
# ATTESA DEL CLUSTER
#
# Senza questo blocco il playbook installava Rancher circa un minuto dopo aver
# avviato rke2-server, quando il nodo e' ancora NotReady e la CNI non ha finito
# di attivarsi. I pod Rancher restavano bloccati in ContainerCreating perche' il
# kubelet non riusciva a creare il sandbox di rete, e il "wait --for=ready" a
# valle andava in timeout dopo 10 minuti.
# ---------------------------------------------------------------------------
- name: Attendi che l'API server RKE2 risponda sulla 6443
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 600

- name: Attendi che il kubectl di RKE2 sia disponibile
  ansible.builtin.wait_for:
    path: /var/lib/rancher/rke2/bin/kubectl
    state: present
    timeout: 300

- name: Attendi che il nodo sia Ready (CNI attiva)
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig=/etc/rancher/rke2/rke2.yaml
      - wait
      - --for=condition=Ready
      - node
      - --all
      - --timeout=600s
  register: node_ready
  changed_when: false
  retries: 3
  delay: 20
  until: node_ready.rc == 0

- name: Attendi che CoreDNS sia disponibile
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig=/etc/rancher/rke2/rke2.yaml
      - -n
      - kube-system
      - rollout
      - status
      - deployment/rke2-coredns-rke2-coredns
      - --timeout=300s
  register: coredns_ready
  changed_when: false
  failed_when: false

- name: Mostra lo stato del cluster prima di installare Rancher
  ansible.builtin.debug:
    msg:
      - "Nodo Ready: si"
      - "CoreDNS: {{ 'pronto' if coredns_ready.rc == 0 else 'non pronto (' ~ (coredns_ready.stderr | default('') | truncate(120)) ~ ')' }}"

- name: Install Helm and kubectl
  block:
    - name: Download Helm
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz
        mode: "0644"

    - name: Extract Helm
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: true

    - name: Move Helm to /usr/local/bin
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: "0755"

    - name: Copy kubectl binary to /usr/local/bin/
      ansible.builtin.copy:
        remote_src: true
        src: /var/lib/rancher/rke2/bin/kubectl
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Create /root/.kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Copy RKE2 kubeconfig to /root/.kube/config
      ansible.builtin.copy:
        remote_src: true
        src: /etc/rancher/rke2/rke2.yaml
        dest: /root/.kube/config
        mode: "0600"

- name: Install Helm and cert-manager on master1
  block:
    - name: Installa Rancher
      ansible.builtin.include_tasks: master1_helm_cert_manager_install.yml
