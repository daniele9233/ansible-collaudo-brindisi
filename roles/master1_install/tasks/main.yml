---
# Installazione RKE2 sul nodo che ospita Rancher (cluster locale).
#
# La versione e' pinnata: senza INSTALL_RKE2_VERSION lo script get.rke2.io
# installa l'ultima release disponibile, che puo' uscire dalla matrice di
# compatibilita' di rancher_version.
#
# Il pin NON esegue upgrade in place: se sul nodo gira gia' una versione
# diversa il playbook si ferma, perche' migrare Kubernetes di piu' minor in
# un colpo (o downgradare) rompe il cluster. In quel caso vedi il messaggio
# di errore del task "Blocca se la versione installata e' diversa".

- name: Verifica se RKE2 e' gia' installato
  ansible.builtin.command: /usr/local/bin/rke2 --version
  register: rke2_installed
  changed_when: false
  failed_when: false

- name: Blocca se la versione RKE2 installata e' diversa da quella richiesta
  ansible.builtin.fail:
    msg: >-
      Su {{ inventory_hostname }} e' installato un RKE2 diverso da
      {{ rke2_version }}:
      {{ rke2_installed.stdout_lines | default(['?']) | first }}.
      Kubernetes non si aggiorna di piu' minor in un colpo e non si downgrada
      in place. Allinea rke2_version alla versione installata, oppure ripulisci
      il nodo con /usr/local/bin/rke2-uninstall.sh (cancella etcd e
      /var/lib/rancher) e rilancia il playbook.
  when:
    - rke2_installed.rc == 0
    - rke2_version not in (rke2_installed.stdout | default(''))
    - not (rke2_allow_version_change | default(false) | bool)

- name: Install RKE2 on master1 ({{ rke2_version }})
  ansible.builtin.shell:
    cmd: curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION='{{ rke2_version }}' sh -
    executable: /bin/bash
  when: rke2_version not in (rke2_installed.stdout | default(''))

- name: Enable RKE2 server service
  ansible.builtin.systemd:
    name: rke2-server
    enabled: true

- name: Start RKE2 server service
  ansible.builtin.systemd:
    name: rke2-server
    state: started
