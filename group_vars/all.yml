---
# Variabili comuni per tutti gli host

# Dominio e credenziali
rancher_domain: "kikko.app.inail-svil.almaviva.it"
rancher_password: "kikkoapp.2025"

# Versioni software
# ---------------------------------------------------------------------------
# MATRICE DI COMPATIBILITA'
#
#   Rancher 2.11  ->  Kubernetes 1.30 / 1.31 / 1.32   <-- combinazione IN USO
#   Rancher 2.12  ->  Kubernetes 1.31 / 1.32 / 1.33
#   Rancher 2.13  ->  Kubernetes 1.32 / 1.33 / 1.34
#   Rancher 2.14  ->  Kubernetes 1.33 / 1.34 / 1.35
#
# Le versioni qui sotto sono quelle GIA' COLLAUDATE su questo ambiente.
# Non alzarle tutte insieme: Rancher supporta una sola minor per volta
# (2.11 -> 2.12 -> 2.13 -> 2.14), e Kubernetes non si downgrada in place.
# Per aggiornare: una minor alla volta, verificando con check_versions.yml e
# aspettando che i pod Rancher siano Running prima del passo successivo.
#
#   ansible-playbook -i inventory.ini check_versions.yml
# ---------------------------------------------------------------------------
# Helm resta sulla linea 3.x: i chart Rancher sono validati su Helm 3.
# Helm 4 e' una major con breaking change.
helm_version: "v3.11.0"
rancher_version: "2.11.2"

# Versione RKE2 del cluster LOCALE che ospita Rancher (nodo masters).
# Deve stare nella finestra supportata da rancher_version. Il pin evita che
# get.rke2.io installi l'ultima release disponibile, che puo' uscire dalla
# matrice.
# ATTENZIONE: cambiare questo valore su un nodo dove RKE2 gira gia' significa
# migrare Kubernetes in place. E' supportato solo di una minor per volta, e il
# downgrade non e' supportato affatto: serve /usr/local/bin/rke2-uninstall.sh
# e una reinstallazione pulita.
rke2_version: "v1.31.11+rke2r1"

# Configurazione disco
vg_name: "vg_rancher"
lv_name: "lv_rancher"
rancher_mount_point: "/var/lib/rancher"
filesystem_type: "xfs"
mount_options: "defaults,noatime"

# Disco dati: lasciare vuoto per la selezione automatica (viene scelto solo un
# disco privo di partizioni, filesystem, firme LVM e mount attivi).
# Per forzare un device specifico: rancher_disk_device: "/dev/sdb"
# Verifica sempre prima con: ansible-playbook -i inventory.ini check_disk.yml
rancher_disk_device: ""

# Certificati
fullchain_pem_file: "fullchain.pem"
privkey_pem_file: "privkey.pem"
cacerts_pem_file: "cacerts.pem"
remote_cert_path: "/root"

# Cluster configuration
cluster_name: "brindisicoll"
# Versione Kubernetes dei cluster downstream creati via API Rancher.
# Deve rientrare nella finestra supportata da rancher_version (vedi sopra).
cluster_k8s_version: "v1.31.11+rke2r1"
cluster_cni: "canal"
ansibleSshHost: "localhost"

# Master node configuration (per kubectl setup sui new_managers)
master_node_ip: "10.205.166.214"
master_node_user: "root"
# master_node_name usa rancher_domain (evita duplicazioni)
# NFS VARS ####


# Variabili blocco Rancher
nginx_server_name: "kikko.app.inail-svil.almaviva.it"
nginx_ssl_cert_path: "/etc/nginx/cert/fullchain.pem"
nginx_ssl_key_path: "/etc/nginx/cert/privkey.pem"

# Variabili blocco Multi-Servizi
multi_services_server_names:
  - "kibana.app.inail-svil.almaviva.it"
  - "grafana.app.inail-svil.almaviva.it"
  - "pgadmin.app.inail-svil.almaviva.it"

multi_services_ssl_cert_path: "/etc/nginx/cert/fullchain.pem"
multi_services_ssl_key_path: "/etc/nginx/cert/privkey.pem"

# Upstream servers
rancher_servers_https:
  - server: "10.205.166.214:443"
    max_fails: 3
    fail_timeout: "5s"


rancher_ingress_https:
  - server: "10.205.166.219:443"
    max_fails: 3
    fail_timeout: "5s"

rancher_ingress_https_1:
  - server: "10.205.166.220:443"
    max_fails: 3
    fail_timeout: "5s"


# Configurazione Nginx
nginx_user: "www-data"
nginx_worker_processes: 2
nginx_worker_rlimit_nofile: 40000
nginx_client_max_body_size: "2G"

# Path directory certificati
nginx_cert_dir: "/etc/nginx/cert"

# Path locali certificati
local_ssl_cert_path: "files/fullchain.pem"
local_ssl_key_path: "files/privkey.pem"

# Timeout configurations
helm_timeout: "15m"
pod_wait_timeout: "5m"  # Ridotto per evitare blocchi lunghi
