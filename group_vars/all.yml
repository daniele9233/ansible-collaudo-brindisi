---
# Variabili comuni per tutti gli host

# Dominio e credenziali
rancher_domain: "rancher-coll.asl.brindisi.it"
rancher_password: "BRINDISICOLL.2025"

# Versioni software
# ---------------------------------------------------------------------------
# MATRICE DI COMPATIBILITA' (verificata ad agosto 2026)
#
#   Rancher 2.14.3  ->  Kubernetes 1.33 / 1.34 / 1.35  (RKE2, K3s, EKS, AKS, GKE)
#
# rancher_version deve essere presente nel repo Helm "rancher-stable"
# (https://releases.rancher.com/server-charts/stable). 2.14.3 e' l'ultima
# release pubblicata su quel canale; 2.15.x esce prima su "rancher-latest"
# e non va usata in collaudo/produzione finche' non passa su stable.
#
# Le versioni pinnate qui sotto si validano a runtime con:
#   ansible-playbook -i inventory.ini check_versions.yml
# ---------------------------------------------------------------------------
helm_version: "v3.11.0"
rancher_version: "2.14.3"

# Versione RKE2 del cluster LOCALE che ospita Rancher (nodo masters).
# Va tenuta dentro la finestra supportata da rancher_version: senza questo pin
# lo script get.rke2.io installa sempre l'ultima release disponibile, che puo'
# uscire dalla matrice di compatibilita' (es. 1.36) e rompere Rancher.
rke2_version: "v1.34.9+rke2r1"

# Configurazione disco
vg_name: "vg_rancher"
lv_name: "lv_rancher"
rancher_mount_point: "/var/lib/rancher"
filesystem_type: "xfs"
mount_options: "defaults,noatime"

# Disco dati: lasciare vuoto per la selezione automatica (viene scelto solo un
# disco privo di partizioni, filesystem, firme LVM e mount attivi).
# Per forzare un device specifico: rancher_disk_device: "/dev/sdb"
# Verifica sempre prima con: ansible-playbook -i inventory.ini check_disk.yml
rancher_disk_device: ""

# Certificati
fullchain_pem_file: "fullchain.pem"
privkey_pem_file: "privkey.pem"
cacerts_pem_file: "cacerts.pem"
remote_cert_path: "/root"

# Cluster configuration
cluster_name: "brindisicoll"
# Versione Kubernetes dei cluster downstream creati via API Rancher.
# Deve rientrare nella finestra supportata da rancher_version (vedi sopra).
cluster_k8s_version: "v1.34.9+rke2r1"
cluster_cni: "canal"
ansibleSshHost: "localhost"

# Master node configuration (per kubectl setup sui new_managers)
master_node_ip: "10.109.10.66"
master_node_user: "root"
# master_node_name usa rancher_domain (evita duplicazioni)
# NFS VARS ####


# Variabili blocco Rancher
nginx_server_name: "rancher-coll.asl.brindisi.it"
nginx_ssl_cert_path: "/etc/nginx/cert/fullchain.pem"
nginx_ssl_key_path: "/etc/nginx/cert/privkey.pem"

# Variabili blocco Multi-Servizi
multi_services_server_names:
  - "kibana-coll.asl.brindisi.it"
  - "grafana-coll.asl.brindisi.it"
  - "harbor-coll.asl.brindisi.it"
  - "pgadmin-coll.asl.brindisi.it"
  - "kafkaui-coll.asl.brindisi.it"

multi_services_ssl_cert_path: "/etc/nginx/cert/fullchain.pem"
multi_services_ssl_key_path: "/etc/nginx/cert/privkey.pem"

# Upstream servers
rancher_servers_https:
  - server: "10.109.10.66:443"
    max_fails: 3
    fail_timeout: "5s"


rancher_ingress_https:
  - server: "10.109.10.68:443"
    max_fails: 3
    fail_timeout: "5s"

rancher_ingress_https_1:
  - server: "10.109.10.69:443"
    max_fails: 3
    fail_timeout: "5s"


# Configurazione Nginx
nginx_user: "www-data"
nginx_worker_processes: 2
nginx_worker_rlimit_nofile: 40000
nginx_client_max_body_size: "2G"

# Path directory certificati
nginx_cert_dir: "/etc/nginx/cert"

# Path locali certificati
local_ssl_cert_path: "files/fullchain.pem"
local_ssl_key_path: "files/privkey.pem"

# Timeout configurations
helm_timeout: "15m"
pod_wait_timeout: "5m"  # Ridotto per evitare blocchi lunghi
